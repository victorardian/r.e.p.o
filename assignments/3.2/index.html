<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Opdracht</title>
    </head>
    <body>
        <form action="">
            <div>
                <input type="text" placeholder="voornaam" minlength="2" pattern="[A-Za-z]+" required>
            </div>
            <div>
                <input type="text" placeholder="achternaam" pattern="[A-Za-z]+" required>
            </div>
            <div>
                <input type="radio" id="dhr" value="dhr" name="aanhef" checked required>
                <label for="dhr">dhr.</label>
            </div>
            <div>
                <input type="radio" id="mevr" value="mevr" name="aanhef" required>
                <label for="mevr">mevr.</label>
            </div>
            <div>
                <input type="radio" id="anders" value="anders" name="aanhef" required>
                <label for="anders">anders</label>
            </div>
            <div>
                <input type="text" placeholder="straatnaam met huisnummer" required>
            </div>
            <div>
                <input type="text" placeholder="postcode (geen spatie)" minlength="6" maxlength="6" pattern="[A-Z]{4}[0-9]{2}+" required>
            </div>
            <div>
                <input type="text" placeholder="woonplaats" required>
            </div>
            <div>
                <input type="text" placeholder="land" required>
            </div>
            <div>
                <input type="text" placeholder="IBAN-nummer" value="NL" pattern="[A-Z]{2}[0-9]{2}[A-Z]{4}[0-9]{10}+" required>
            </div>
            <div>
                <input type="radio" id="mobiel" value="mobiel" name="abonnement" required>
                <label for="mobiel">mobiel</label>
            </div>
            <div>
                <input type="radio" id="glasvezel" value="glasvezel" name="abonnement" required>
                <label for="glasvezel">glasvezel</label>
            </div>
            <div>
                <input type="radio" id="tv" value="tv" name="abonnement" required>
                <label for="tv">tv</label>
            </div>
            <div>
                <input type="date" placeholder="datum van ingang abonnement" id="dateform" required>
            </div>
            <div>
                <input type="number" placeholder="looptijd abonnement" min="0" required>
            </div>
            <div>
                <input type="number" placeholder="gebruikers" min="0" max="4" required>
            </div>
            <div>
                <input type="email" placeholder="email" required>
            </div>
            <div>
                <input type="password" placeholder="wachtwoord" required>
            </div>
            <div>
                <input type="submit" placeholder="sluit abonnement af">
            </div>
        </form>
        <script src="script.js"></script>
    </body>
</html>
